# Her gün ilanları tarar, sonuçları depoya kaydeder ve özet sayfasını yayınlar.
name: Günlük ilan taraması

on:
  schedule:
    - cron: "0 6 * * *"   # her gün 06:00 UTC = 09:00 Türkiye saati
  workflow_dispatch:       # GitHub'daki "Run workflow" düğmesiyle elle çalıştırma

permissions:
  contents: write   # tarama sonuçlarını depoya geri kaydetmek için
  pages: write      # özet sayfasını yayınlamak için
  id-token: write

concurrency:
  group: tara
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: İlanları tara
        env:
          NTFY_KONU: ${{ secrets.NTFY_KONU }}
        run: python tara.py

      - name: Sonuçları depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data rapor
          git diff --cached --quiet || git commit -m "Günlük tarama $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rapor
      - id: yayin
        uses: actions/deploy-pages@v4
